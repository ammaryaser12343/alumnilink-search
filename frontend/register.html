<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlumniLink | Sign up</title>
  <link rel="icon" type="image/png" href="alumnilink-badge.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/identity.css">
  <link rel="stylesheet" href="css/theme.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <h1><a class="site-brand" href="index.html" aria-label="AlumniLink home">AlumniLink</a></h1>
    <nav aria-label="Main">
      <a href="login.html">Log in</a>
      <a href="register.html" aria-current="page">Sign up</a>
    </nav>
  </header>

  <main class="auth-main">
    <h2>Create your account</h2>
    <p id="status" class="form-status" role="status" aria-live="polite"></p>

    <form id="register-form" class="auth-form" novalidate>
      <label>Full name
        <input type="text" id="name" autocomplete="name" minlength="2" maxlength="100" required>
      </label>

      <label>University email
        <input type="email" id="email" autocomplete="email" maxlength="255" required>
      </label>

      <label>I am a
        <select id="role" required>
          <option value="">Choose one</option>
          <option value="student">Student or staff</option>
          <option value="alumni">Alumni (graduate)</option>
        </select>
      </label>

      <label>Password
        <input type="password" id="password" autocomplete="new-password" minlength="8" maxlength="72" required>
      </label>
      <p class="help">8 to 72 characters, with at least one letter and one number.</p>

      <label>Confirm password
        <input type="password" id="confirm" autocomplete="new-password" maxlength="72" required>
      </label>

      <!-- Cloudflare draws the "Verify you are human" box here -->
      <div id="turnstile-widget" class="turnstile"></div>

      <div class="actions">
        <button type="submit" id="register-button">Create account</button>
      </div>
      <p class="help">An admin checks every new account before it can log in.
        Already have an account? <a href="login.html">Log in</a></p>
    </form>
  </main>

  <!-- Turnstile first, then the shared helpers, then this page's code (defer keeps the order) -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/turnstile.js" defer></script>
  <script src="js/register.js" defer></script>
</body>
</html>
