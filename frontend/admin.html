<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlumniLink | Administration</title>
  <link rel="icon" type="image/png" href="alumnilink-badge.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/identity.css">
  <link rel="stylesheet" href="css/theme.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <h1><a class="site-brand" href="index.html" aria-label="AlumniLink home">AlumniLink</a></h1>
    <nav aria-label="Main">
      <a href="index.html">Search</a>
      <a href="admin.html" aria-current="page">Admin</a>
      <button id="logout" type="button">Sign out</button>
    </nav>
  </header>

  <main>
    <h2>Administration</h2>
    <p id="status" class="form-status" role="status" aria-live="polite"></p>

    <div class="tabs" role="tablist" aria-label="Admin sections">
      <button type="button" role="tab" id="tab-verifications" aria-controls="panel-verifications" aria-selected="true">Waiting list</button>
      <button type="button" role="tab" id="tab-users" aria-controls="panel-users" aria-selected="false">Accounts</button>
      <button type="button" role="tab" id="tab-logs" aria-controls="panel-logs" aria-selected="false">Audit log</button>
    </div>

    <!-- 1. Waiting list: approve or reject new sign-ups -->
    <section id="panel-verifications" role="tabpanel" aria-labelledby="tab-verifications">
      <form id="verifications-form" class="search-form" novalidate>
        <label>Show
          <select id="v-status">
            <option value="pending">Waiting for approval</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
            <option value="all">All requests</option>
          </select>
        </label>
        <button type="submit">Show</button>
      </form>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Name</th><th>Email</th><th>Role</th><th>Signed up</th><th>Request</th><th>Actions</th></tr>
          </thead>
          <tbody id="v-rows"></tbody>
        </table>
      </div>
    </section>

    <!-- 2. Accounts: search everyone, suspend or reactivate -->
    <section id="panel-users" role="tabpanel" aria-labelledby="tab-users" hidden>
      <form id="users-form" class="search-form" novalidate>
        <label>Name or email
          <input type="text" id="u-q" maxlength="100" placeholder="e.g. sara">
        </label>
        <label>Role
          <select id="u-role">
            <option value="">Any role</option>
            <option value="student">Student</option>
            <option value="alumni">Alumni</option>
            <option value="admin">Admin</option>
          </select>
        </label>
        <label>Status
          <select id="u-status">
            <option value="">Any status</option>
            <option value="pending">Pending</option>
            <option value="active">Active</option>
            <option value="suspended">Suspended</option>
            <option value="rejected">Rejected</option>
          </select>
        </label>
        <button type="submit">Search</button>
      </form>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr>
          </thead>
          <tbody id="u-rows"></tbody>
        </table>
      </div>
      <nav class="pager" aria-label="Account pages">
        <button type="button" id="u-prev" disabled>Previous</button>
        <span id="u-page"></span>
        <button type="button" id="u-next" disabled>Next</button>
      </nav>
    </section>

    <!-- 3. Audit log: security events from all three services -->
    <section id="panel-logs" role="tabpanel" aria-labelledby="tab-logs" hidden>
      <form id="logs-form" class="search-form" novalidate>
        <label>Service
          <select id="l-service">
            <option value="">All services</option>
            <option value="admin">Identity and admin</option>
            <option value="search">Search</option>
            <option value="profile">Profile</option>
          </select>
        </label>
        <label>Action
          <input type="text" id="l-action" list="l-actions" maxlength="50" placeholder="e.g. LOGIN">
          <datalist id="l-actions">
            <option value="LOGIN"></option>
            <option value="REGISTER"></option>
            <option value="APPROVE_USER"></option>
            <option value="REJECT_USER"></option>
            <option value="SUSPEND_USER"></option>
            <option value="REACTIVATE_USER"></option>
            <option value="ADMIN_ACCESS"></option>
            <option value="CREATE_ADMIN"></option>
          </datalist>
        </label>
        <label>Result
          <input type="text" id="l-outcome" maxlength="20" placeholder="e.g. wrong_password">
        </label>
        <label>From
          <input type="date" id="l-from">
        </label>
        <label>To
          <input type="date" id="l-to">
        </label>
        <button type="submit">Filter</button>
      </form>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Time</th><th>Service</th><th>Action</th><th>Result</th><th>Who</th><th>Target</th></tr>
          </thead>
          <tbody id="l-rows"></tbody>
        </table>
      </div>
      <nav class="pager" aria-label="Audit log pages">
        <button type="button" id="l-prev" disabled>Previous</button>
        <span id="l-page"></span>
        <button type="button" id="l-next" disabled>Next</button>
      </nav>
    </section>
  </main>

  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/admin.js" defer></script>
</body>
</html>
